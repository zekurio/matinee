name: Feature request
description: Something Matinee doesn't do yet.
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Check [Not built yet](https://github.com/zekurio/matinee/blob/main/apps/server/README.md#not-built-yet)
        first. If it's listed there, comment on an existing issue rather than opening a new one.
        If you want to build it yourself, say so here and wait for a reply before opening a PR.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and this hasn't been asked for.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - Android app (phone or tablet)
        - Android TV
        - Playback, streaming, or transcoding
        - Library scanning or metadata
        - Sign-in, accounts, or access
        - Watch parties
        - NixOS module or package
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do and what gets in the way today.
      placeholder: My anime library numbers episodes 1 to 500 with no seasons, so TheTVDB matches put them in the wrong season.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Mention how Jellyfin or Plex handle it if that helps.

  - type: dropdown
    id: contribute
    attributes:
      label: Would you open a PR for it?
      options:
        - No
        - Yes, once we agree on the approach
