name: ci

# Every check, in one workflow so the `ci` job at the end can stand for
# all of them. The ruleset on main requires only that job. The workflow
# always runs, and `changes` skips the checks a change doesn't touch
# (tools/ci/changes.mjs says why it isn't a `paths` filter). The run on
# main pushes the nix package to the binary cache, for hosts that follow
# main.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pnpm: ${{ steps.changes.outputs.pnpm }}
      flutter: ${{ steps.changes.outputs.flutter }}
      flutter_ios: ${{ steps.changes.outputs.flutter_ios }}
      nix: ${{ steps.changes.outputs.nix }}

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: find the checks to run
        id: changes
        run: node tools/ci/changes.mjs pnpm flutter flutter_ios nix
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PATHS_PNPM: |
            **
            !**.md
          # The generated API client lives in the app, and the analyzer
          # checks it, so a contract change runs this too.
          PATHS_FLUTTER: |
            apps/flutter/**
            apps/web/src/i18n/locales/en/*.ts
            apps/web/src/i18n/locales/de/*.ts
            brand/android/**
            packages/contracts/**
            apps/server/scripts/**
            nix/flutter.nix
            flake.nix
            flake.lock
            package.json
            tools/ci/**
            .github/workflows/ci.yml
            !**/*.md
          # What the iOS build compiles: the Dart and the Runner, icon included.
          PATHS_FLUTTER_IOS: |
            apps/flutter/**
            apps/web/src/i18n/locales/en/*.ts
            apps/web/src/i18n/locales/de/*.ts
            packages/contracts/**
            apps/server/scripts/**
            tools/ci/**
            .github/workflows/ci.yml
            !**/*.md
            !apps/flutter/android/**
            !apps/flutter/test/**
          PATHS_NIX: |
            nix/**
            apps/**
            packages/**
            flake.nix
            flake.lock
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .envrc
            .env.example
            tools/ci/**
            .github/workflows/ci.yml
            !**/*.md
            !apps/flutter/**

  checks:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.pnpm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # An upstream advisory must not block the PR, so the audit shows its
    # failure without failing `ci`.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dependency audit
            command: pnpm audit
            optional: true
          - name: pnpm checks
            command: pnpm verify && pnpm build
            optional: false

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  flutter:
    name: flutter analyze, test, and build
    needs: changes
    if: needs.changes.outputs.flutter == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Caches Gradle's downloads and build cache. Flutter runs Gradle in
      # the flake's Flutter shell, with its JDK and SDK.
      - name: set up gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: analyze, format check, and test
        run: nix shell nixpkgs#just -c just flutter check

      - name: build debug apk
        run: nix shell nixpkgs#just -c just flutter build

  flutter-ios:
    name: flutter ios build
    needs: changes
    if: needs.changes.outputs.flutter_ios == 'true' && github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: select xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      # The flake's Flutter shell is Linux-only. The same version as its
      # nixpkgs, from Flutter's own releases.
      - name: set up flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      # Unsigned, for a device: it compiles the Dart, the Runner's Swift,
      # and links MPVKit, but nothing runs.
      - name: build unsigned debug app
        working-directory: apps/flutter
        run: flutter build ios --debug --no-codesign

  nix:
    name: nix flake check
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Read-only without the secret (fork PRs); pushes from same-repo runs.
      - name: set up cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zekurio
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # A pnpm-lock.yaml change needs a new pnpmDepsHash in nix/package.nix;
      # this step fails with the hash to put there.
      - name: check nix flake
        run: nix flake check --print-build-logs

      - name: check dev shell
        run: |
          nix develop --command bash -euc '
            trap "matinee-postgres stop" EXIT
            test -s .env
            pg_isready
            psql -Atc "SELECT 1" | grep -qx 1
          '

  # The one check the ruleset requires. A skipped job passes, so this
  # fails only on a check that failed or was cancelled, `changes` included.
  ci:
    name: ci
    needs: [changes, checks, flutter, flutter-ios, nix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: fail if a check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
