name: desktop (windows)

# Builds the desktop app on Windows, which the flake doesn't cover:
# `nix flake check` in ci.yml builds it for Linux. A workflow of its own,
# outside the `ci` job the ruleset requires, so that a hosted runner's
# change of Visual Studio doesn't block a pull request that never touched
# the app.
on:
  pull_request:
    paths:
      - apps/desktop/**
      - packages/desktop-bridge/**
      - tools/ci/mpv-windows.mjs
      - .github/workflows/desktop-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # The app's own pages, which CMake builds into the program.
      - name: build the pages
        run: pnpm install --frozen-lockfile && pnpm --filter @matinee/desktop build

      # The Qt that nixpkgs has, so every system builds against one.
      - name: install qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: 6.12.0
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: set up visual studio
        uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0

      - name: install mpv
        run: node tools/ci/mpv-windows.mjs

      - name: configure
        run: cmake -S apps/desktop/native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build
