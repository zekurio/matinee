packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@orpc/client": 1.16.1
  "@orpc/contract": 1.16.1
  "@orpc/json-schema": 1.16.1
  "@orpc/openapi": 1.16.1
  "@orpc/server": 1.16.1
  "@orpc/tanstack-query": 1.16.1
  "@simplewebauthn/browser": 14.0.0
  "@simplewebauthn/server": 14.0.3
  blurhash: 2.0.5
  drizzle-orm: 0.45.4
  pg: 8.23.1
  vite: 8.3.6
  typebox: 1.4.2

allowBuilds:
  # Only prints a request for funding.
  core-js: false
  esbuild: true
  lfa-ponyfill: false
  # Picks between Vue 2 and 3 on install; its default is already Vue 3.
  vue-demi: false

overrides:
  # GHSA-67mh-4wv8-2f99: drizzle-kit still loads esbuild 0.18 through the
  # deprecated @esbuild-kit packages. Drop this once drizzle-kit stops.
  esbuild: 0.28.2

auditConfig:
  ignoreGhsas:
    # picomatch ReDoS, no patched release yet. It only reaches us through
    # build tooling (vite, and @unhead/bundler under the API docs page's
    # @scalar packages), which matches our own config's globs, never input.
    # Drop this once picomatch ships a fix.
    - GHSA-fc5q-39xc-vjpf

minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.106.1"
  - vite@8.3.6
