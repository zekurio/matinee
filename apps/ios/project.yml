# The Xcode project, for XcodeGen. Matinee.xcodeproj is generated from this
# and git-ignored: run `just generate` (or `nix run nixpkgs#xcodegen --
# generate`) in apps/ios. Sources and resources are picked up by folder, so
# adding a file never edits this spec.
name: Matinee

options:
  bundleIdPrefix: io.github.zekurio
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
  createIntermediateGroups: true
  # Before each generate: the version from the root package.json, as
  # everywhere else, into Config/Version.xcconfig, and the app icon from
  # brand/ios into Matinee/Resources/AppIcon.xcassets, both git-ignored.
  preGenCommand: scripts/version.sh && scripts/appicon.sh

packages:
  MatineeMPV:
    path: Packages/MatineeMPV
  MatineeCore:
    path: Packages/MatineeCore
  MatineeKit:
    path: Packages/MatineeKit
  Nuke:
    url: https://github.com/kean/Nuke
    exactVersion: 13.2.3

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Text the app shows comes from the generated accessors in
    # UI/Strings.gen.swift, so nothing should be extracted from code into
    # the catalogs, which Xcode would otherwise rewrite on every build.
    SWIFT_EMIT_LOC_STRINGS: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Matinee:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    sources:
      - path: Matinee
        excludes:
          - Info.plist
          - UI/README.md
          - UI/kit-exclusions.txt
    dependencies:
      - package: MatineeMPV
      - package: MatineeCore
      - package: MatineeKit
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zekurio.matinee
        PRODUCT_NAME: Matinee
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Swift 6 with the main actor as the default: views and the state
        # they own need no annotations, and what runs elsewhere says so.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    info:
      path: Matinee/Info.plist
      properties:
        CFBundleDisplayName: Matinee
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleAllowMixedLocalizations: false
        CFBundleLocalizations: [en, de]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        UISupportedInterfaceOrientations~ipad:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationPortraitUpsideDown,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        # Where the browser hands back the sign-in code, matinee://auth/callback.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.zekurio.matinee
            CFBundleURLSchemes: [matinee]
        # Playback goes on with the screen locked and in picture in picture.
        UIBackgroundModes: [audio]
        # English here; every language's words, these included, are in
        # Resources/InfoPlist.xcstrings.
        NSLocalNetworkUsageDescription: Matinee connects to your media server on your local network.
        NSCameraUsageDescription: Matinee uses the camera to scan the code a TV shows to sign it in.
        # Matinee is self-hosted: servers on a home network often speak plain
        # HTTP, which Android's network_security_config allows everywhere, so
        # this does too. A certificate from the owner's own authority works
        # once its profile is installed and trusted in Settings, as iOS has it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

  # The Apple TV app (MatineeTV/README.md). Its own screens are in
  # MatineeTV/; the app-level pieces it shares with the iPhone app are listed
  # here one by one, compiled into both targets from where they are, so a
  # change to one of them reaches both apps and has to build for both.
  MatineeTV:
    type: application
    platform: tvOS
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    sources:
      - path: MatineeTV
        excludes:
          - Info.plist
          - README.md
          - Remote
      # Shared with the iPhone app: the generated words and their catalogs,
      # loading and failure words, formatting, the theme, the navigator,
      # toasts, artwork over Nuke, the QR code, the sign-in flows' state,
      # the login backdrop, and Home's debug stand-ins.
      - Matinee/UI/Strings.gen.swift
      - Matinee/UI/State.swift
      - Matinee/UI/Format.swift
      - Matinee/UI/ThemeStore.swift
      - Matinee/UI/Navigator.swift
      - Matinee/UI/components/Toasts.swift
      - Matinee/UI/components/Picture.swift
      - Matinee/UI/components/QrCode.swift
      - Matinee/UI/signin/SignInState.swift
      - Matinee/UI/signin/LoginBackdrop.swift
      - Matinee/UI/home/HomeDevData.swift
      # The detail pages' facts, file info, and debug fixtures (-title.fixture,
      # -dev.browseFixtures), shared with the iPhone's title and person pages.
      - Matinee/UI/title/TitleData.swift
      - Matinee/UI/browse/BrowseFixtures.swift
      - Matinee/Resources/Localizable.xcstrings
      - Matinee/Resources/iOS.xcstrings
      - Matinee/Resources/Assets.xcassets
    dependencies:
      - package: MatineeMPV
      - package: MatineeCore
      - package: MatineeKit
        product: MatineeKit
      - package: MatineeKit
        product: MatineeKitGallery
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        # The same identifier as the iPhone app's, so the App Store sells
        # them as one app (universal purchase).
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zekurio.matinee
        PRODUCT_NAME: Matinee
        TARGETED_DEVICE_FAMILY: "3"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        # The layered icon and the Top Shelf image, from scripts/tvicon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        # Written by hand, not by XcodeGen, so it can live in the repository
        # beside the sources: MatineeTV/Info.plist.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MatineeTV/Info.plist
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    scheme:
      testTargets: [MatineeTVRemote]

  # Presses the Siri Remote on an Apple TV simulator from a script, for
  # MatineeTV/Remote/remote.sh: a UI test only so XCUIRemote can reach the
  # focus engine. The script itself is the kit gallery's.
  MatineeTVRemote:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - Packages/MatineeKit/Gallery/Remote/RemoteScript.swift
    dependencies:
      - target: MatineeTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zekurio.matinee.tv-remote
        TEST_TARGET_NAME: MatineeTV
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
