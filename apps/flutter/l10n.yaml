# gen_l10n: the ARB files in lib/l10n, English first. `flutter pub get`
# writes lib/l10n/app_localizations*.dart, which git ignores.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
required-resource-attributes: false
untranslated-messages-file: build/untranslated.json
