# The version is the root package.json's, which `just tag` sets; the
# Android and iOS builds read it from there, so there's none here.
name: matinee
description: Matinee for phones, tablets, and TVs.
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^30.0.4

flutter:
  uses-material-design: false
  generate: true
