# The version is the root package.json's, which `just tag` sets; the
# Android and iOS builds read it from there, so there's none here.
name: matinee
description: Matinee for phones, tablets, and TVs.
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.1
  flutter_web_auth_2: ^6.0.0
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  qr: ^4.0.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^30.0.4
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: false
  generate: true
  # Shown in Settings, About, Licenses.
  assets:
    - NOTICE.md
  fonts:
    - family: Red Hat Text
      fonts:
        - asset: assets/fonts/red_hat_text.ttf
