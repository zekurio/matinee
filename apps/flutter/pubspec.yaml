# The version is the root package.json's, which `just tag` sets; the
# Android and iOS builds read it from there, so there's none here.
name: matinee
description: Matinee for phones, tablets, and TVs.
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  clock: ^1.1.2
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  dynamic_color: ^2.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.1
  flutter_web_auth_2: ^6.0.0
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  material_color_utilities: ^0.13.0
  path_provider: ^2.1.6
  qr: ^4.0.1
  shared_preferences: ^2.5.6
  # An Apple TV keeps the settings itself: lib/core/apple_tv.dart.
  shared_preferences_platform_interface: ^2.4.2

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.1.1
  pigeon: ^30.0.4

flutter:
  uses-material-design: false
  generate: true
  # Shown in Settings, About, Licenses: the notices, the project's license,
  # and the licenses the build bundles that Flutter's NOTICES leaves out.
  assets:
    - NOTICE.md
    - LICENSE
    - assets/licenses/
  fonts:
    - family: Red Hat Text
      fonts:
        - asset: assets/fonts/red_hat_text.ttf
    # Unbounded Bold's capitals and digits, for an avatar's initial. Written
    # by brand/wordmark.py.
    - family: Unbounded
      fonts:
        - asset: assets/fonts/unbounded_initials.ttf
          weight: 700
