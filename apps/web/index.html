<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <script>
      // Set the theme class and colors before paint to avoid a flash.
      // Mirrors @matinee/ui/lib/theme; keep the storage keys in sync.
      try {
        var themeCss = localStorage.getItem("matinee.theme-css")
        if (themeCss) {
          var themeStyle = document.createElement("style")
          themeStyle.id = "matinee-theme"
          themeStyle.textContent = themeCss
          document.head.appendChild(themeStyle)
        }
      } catch {}
      try {
        var preferences = JSON.parse(
          localStorage.getItem("matinee.theme") || "null",
        )
        var mode =
          preferences &&
          (preferences.mode === "dark" ||
            preferences.mode === "light" ||
            preferences.mode === "system")
            ? preferences.mode
            : "dark"
        var dark =
          mode === "dark" ||
          (mode !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
      } catch {
        document.documentElement.classList.add("dark")
      }
    </script>
    <script>
      // Ask who is signed in while the app's code loads; every page but the
      // login waits for that before it renders. lib/rpc.ts hands the answer
      // to the client's first matching request. Home's rows aren't asked
      // for here: with them the first render waits for the whole page, and
      // over HTTP/1.1 they hold up the app's own code.
      try {
        var path = location.pathname
        if (path !== "/login" && path !== "/setup") {
          var url = "/api/rpc/auth/session"
          window.__matineePreload = {}
          window.__matineePreload[url + " {}"] = fetch(url, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: "{}",
            credentials: "same-origin",
          })
        }
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Matinee</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
